name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: LLM evaluation (runs only if the GEMINI_API_KEY secret is set)
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/eval_llm.py

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t infra-health-monitor:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: kind load docker-image infra-health-monitor:ci --name ci
      - run: kubectl apply -f k8s/monitor.yaml
      - run: kubectl rollout status deployment/infra-monitor --timeout=180s
      - name: Smoke test through the Service
        run: |
          kubectl port-forward service/infra-monitor 8080:80 &
          sleep 5
          curl -sf localhost:8080/health
          curl -sf -X POST localhost:8080/analyze -H 'Content-Type: application/json' \
            -d '{"logs":["app[1]: ERROR could not connect to db: connection refused"]}'
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app=infra-monitor
          kubectl logs -l app=infra-monitor --tail=50

  docker:
    needs: [test, terraform, kubernetes]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
