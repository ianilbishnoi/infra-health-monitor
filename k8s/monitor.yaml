# Deployment + Service for infra-health-monitor.
# CI deploys this to a throwaway kind cluster and checks /health through the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-monitor
  labels:
    app: infra-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infra-monitor
  template:
    metadata:
      labels:
        app: infra-monitor
    spec:
      containers:
        - name: monitor
          image: infra-health-monitor:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CPU_ALERT_PERCENT
              value: "85"
            - name: GEMINI_API_KEY # optional; create with: kubectl create secret generic gemini --from-literal=api-key=...
              valueFrom:
                secretKeyRef:
                  name: gemini
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: infra-monitor
spec:
  selector:
    app: infra-monitor
  ports:
    - port: 80
      targetPort: 8000
